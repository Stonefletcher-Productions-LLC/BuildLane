name: Windows checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoProfile -STA -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dashboard and profile regression checks
        timeout-minutes: 4
        run: ./app/TestLaneApp.ps1
      - name: Responsive command and machine-health checks
        timeout-minutes: 4
        run: ./app/TestLaneFeedback.ps1
      - name: Responsive release actions and connection checks
        timeout-minutes: 4
        run: ./app/TestLaneActions.ps1
      - name: Waiting reasons and timing history checks
        timeout-minutes: 4
        run: ./app/TestLaneHistory.ps1
      - name: Automatic native-job handoff and stale status checks
        timeout-minutes: 4
        run: ./app/TestLaneActivity.ps1
      - name: Live PR pagination and status checks
        run: ./app/TestLanePullReader.ps1
      - name: Completed build PR overview checks
        timeout-minutes: 4
        run: ./app/TestLanePullView.ps1 -OutDirectory "$env:RUNNER_TEMP/Buildlane-docs"
      - name: Authoritative integration mode checks
        timeout-minutes: 4
        run: ./app/TestLaneIntegration.ps1 -OutDirectory "$env:RUNNER_TEMP/Buildlane-docs"
      - name: Staging release request checks
        timeout-minutes: 4
        run: ./app/TestLaneReleaseRequests.ps1 -OutDirectory "$env:RUNNER_TEMP/Buildlane-docs"
      - name: Tall window and repeated handoff layout checks
        timeout-minutes: 4
        run: ./app/TestLaneLayout.ps1
      - name: Advisory build choices and request correlation
        timeout-minutes: 4
        run: ./app/TestLanePlanning.ps1
      - name: GitHub pagination regression checks
        timeout-minutes: 4
        run: ./app/TestLaneGitHub.ps1
      - name: First-run onboarding checks
        timeout-minutes: 4
        run: ./app/TestLaneOnboarding.ps1
      - name: Responsive bulk move checks
        timeout-minutes: 4
        run: ./app/TestLaneMoves.ps1
      - name: Shared resource and process cleanup checks
        timeout-minutes: 6
        run: ./app/TestLaneResources.ps1
      - name: Cancelled-job process cleanup checks
        timeout-minutes: 6
        run: ./app/TestLaneProcesses.ps1
      - name: PowerShell 7 resource cleanup checks
        shell: pwsh
        run: ./app/TestLaneResources.ps1
      - name: Local runner checks
        timeout-minutes: 6
        shell: pwsh
        run: node runner/test/TestRunner.cjs
      - name: Fletchery engine checks
        run: |
          $env:PYTHONUTF8 = '1'
          python fletchery/test_fletchery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout recovery and reload lifecycle checks
        run: |
          $env:PYTHONUTF8 = '1'
          python fletchery/test_round_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_github_dispatch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_dispatch_resilience.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_storage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_storage_integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_interruption_results.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_interruption_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_emergency_workers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_plans.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_worker_handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_worker_ranks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_merge_priority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_merge_status.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_routing_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_reload_dispatch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_repair_checkout.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_task_preservation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_resource_waits.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_asset_jobs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_asset_delivery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_pipeline_responsiveness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Control room browser checks
        run: |
          npm ci --prefix ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Automatic prerequisites and merge agent checks
        run: |
          $env:PYTHONUTF8 = '1'
          python fletchery/test_blockers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile standalone launcher
        run: ./app/InstallLaneApp.ps1 -Destination "$env:RUNNER_TEMP\Buildlane-check" -NoShortcut
      - name: Upload illustrative UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-fixtures
          path: ${{ runner.temp }}/Buildlane-docs/*.png
          if-no-files-found: error
          retention-days: 14
